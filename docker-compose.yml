services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: statusboard-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      CLIENT_URL: http://localhost:5173
    volumes:
      - ./server:/app
      - /app/node_modules

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: statusboard-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_SERVER_URL: http://localhost:3001
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend
